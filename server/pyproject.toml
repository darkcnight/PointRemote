[project]
name = "pointremote-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pillow>=11",
  "numpy>=2",
  "torch>=2.8",
  "torchvision>=0.23",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript>=0.3",
  "qrcode>=8",
  "platformdirs>=4",
]

[project.scripts]
pointremote-app = "pointremote.desktop.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pointremote"]

[tool.uv.sources]
# CUDA builds on Windows and Linux; macOS gets the PyPI build (Apple GPU via MPS).
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA GPU"]
