name: Desktop app

# Builds the double-click server app for Windows, macOS and Linux, and checks on each that
# the built app installs its server environment, starts the server and answers.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run pytest -q

  build:
    permissions:
      contents: write  # only for attaching the builds to a release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-15
            name: macOS
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller qrcode pillow platformdirs uv
      - name: Build
        run: |
          export UV_BIN="$(python -c 'import uv; print(uv.find_uv_bin())')"
          pyinstaller --noconfirm packaging/pointremote.spec

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/PointRemote/PointRemote --self-test
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/PointRemote.app/Contents/MacOS/PointRemote --self-test
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PointRemote\PointRemote.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PointRemote\logs\self-test.log"
          exit $p.ExitCode
      - name: Server log on failure
        if: failure()
        run: |
          for f in "$HOME/.local/share/PointRemote/logs/server.log" \
                   "$HOME/Library/Application Support/PointRemote/logs/server.log" \
                   "$LOCALAPPDATA/PointRemote/logs/server.log"; do
            [ -f "$f" ] && cat "$f" || true
          done

      - name: Run the installed server directly (diagnostics)
        if: failure()
        env:
          POINTREMOTE_API_KEY: diagnostics-key-0000
        run: |
          case "${{ runner.os }}" in
            Linux)   rt="$HOME/.local/share/PointRemote/runtime"; py="$rt/.venv/bin/python" ;;
            macOS)   rt="$HOME/Library/Application Support/PointRemote/runtime"; py="$rt/.venv/bin/python" ;;
            Windows) rt="$LOCALAPPDATA/PointRemote/runtime"; py="$rt/.venv/Scripts/python.exe" ;;
          esac
          cd "$rt"
          export POINTREMOTE_DATA_DIR="$RUNNER_TEMP/diag-data"
          timeout 40 "$py" -m pointremote.serve || echo "exit $?"

      - name: Package
        run: |
          cd dist
          case "${{ runner.os }}" in
            Linux)   tar czf ../PointRemote-Linux.tar.gz PointRemote ;;
            macOS)   ditto -c -k --keepParent PointRemote.app ../PointRemote-macOS.zip ;;
            Windows) 7z a -tzip ../PointRemote-Windows.zip PointRemote > /dev/null ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: PointRemote-${{ matrix.name }}
          path: server/PointRemote-${{ matrix.name }}.*
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" PointRemote-${{ matrix.name }}.* --clobber
